# Site config for web.durpalla.com
# Install: ./script/setup-host-nginx.sh
#
# Requires upstream web_durpalla (see web-upstream.conf).

server {
    listen 80;
    listen [::]:80;
    server_name web.durpalla.com;

    client_max_body_size 32M;

    access_log /var/log/nginx/web.durpalla.com.access.log;
    error_log /var/log/nginx/web.durpalla.com.error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://web_durpalla;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
    }
}
